# Trabalho 2 - implantação com Docker Compose.
# Uso: cp .env.example .env && docker compose up --build -d   (acesse http://localhost:8080)

x-backend-env: &backend-env
  DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  REDIS_URL: redis://redis:6379
  RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672
  MINIO_ENDPOINT: http://minio:9000
  MINIO_BUCKET: ${MINIO_BUCKET}
  MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
  MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
  # DynamoDB (auditoria): por padrão o container "dynamodb" (DynamoDB Local). Para usar o da AWS, veja o .env.example
  DYNAMODB_TABLE_NAME: ${DYNAMODB_TABLE_NAME:-stadium-audit-logs}
  DYNAMODB_ENDPOINT: ${DYNAMODB_ENDPOINT-http://dynamodb:8000}
  AWS_REGION: ${AWS_REGION:-us-east-1}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-local}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-local}
  AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
  DATA_DIR: /data # só o outbox de e-mails
  # O site é servido pelo container frontend (nginx), não pela API
  SERVE_FRONTEND: "false"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [backend-net]
    # Sem "ports": o banco só é alcançável pela rede interna (veja docker-compose.dev.yml para acesso local)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    networks: [backend-net]
    ports:
      # Painel de gestão (filas, exchanges, DLQs), só no localhost: http://localhost:15672
      - "127.0.0.1:15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  # MinIO (S3 compatível): banners, miniaturas e PDFs dos ingressos.
  # O minio/minio saiu do Docker Hub; usamos a imagem mantida pela Chainguard.
  minio:
    image: chainguard/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - miniodata:/data
    # backend-net: API e worker; frontend-net: o nginx lê os banners públicos (só GET em /files/banners/)
    networks: [backend-net, frontend-net]
    ports:
      # Console web do MinIO, só no localhost: http://localhost:9001
      - "127.0.0.1:9001:9001"
    healthcheck:
      # A imagem não tem curl/wget: o bash abre um socket e confere o HTTP 200 de /minio/health/live
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /minio/health/live HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && read -r l <&3 && [[ $$l == *200* ]]"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # DynamoDB Local: o mesmo DynamoDB da AWS (API idêntica), rodando em container. Guarda a auditoria das ações.
  # Roda como root porque o volume nomeado nasce de root e a imagem não tem a pasta de dados.
  dynamodb:
    image: amazon/dynamodb-local:latest
    user: root
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-dbPath", "/data"]
    volumes:
      - dynamodata:/data
    networks: [backend-net]
    healthcheck:
      # Sem -f: qualquer resposta HTTP (até 400) prova que o servidor está de pé
      test: ["CMD-SHELL", "curl -s -o /dev/null http://localhost:8000"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    networks: [backend-net]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    env_file: .env
    environment: *backend-env
    volumes:
      - appdata:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
      dynamodb:
        condition: service_healthy
    networks: [backend-net, frontend-net]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  worker:
    build: ./backend
    command: ["node", "worker.js"]
    env_file: .env
    environment: *backend-env
    volumes:
      - appdata:/data
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
      dynamodb:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks: [backend-net]
    restart: unless-stopped

  frontend:
    build: ./frontend
    environment:
      MINIO_BUCKET: ${MINIO_BUCKET}
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    networks: [frontend-net]
    restart: unless-stopped

networks:
  backend-net:
  frontend-net:

volumes:
  pgdata:
  appdata:
  rabbitmqdata:
  miniodata:
  dynamodata:
