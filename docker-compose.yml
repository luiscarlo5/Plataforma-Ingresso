# Trabalho 2 - implantação com Docker Compose.
# Uso: cp .env.example .env && docker compose up --build -d   (acesse http://localhost:8080)

x-backend-env: &backend-env
  DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  REDIS_URL: redis://redis:6379
  # Até as fases MinIO/RabbitMQ: fila e uploads em modo local, em volume compartilhado entre API e worker
  DATA_DIR: /data
  UPLOADS_DIR: /data/uploads
  # O site é servido pelo container frontend (nginx), não pela API
  SERVE_FRONTEND: "false"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [backend-net]
    # Sem "ports": o banco só é alcançável pela rede interna (veja docker-compose.dev.yml para acesso local)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    networks: [backend-net]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    env_file: .env
    environment: *backend-env
    volumes:
      - appdata:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [backend-net, frontend-net]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  worker:
    build: ./backend
    command: ["node", "worker.js"]
    env_file: .env
    environment: *backend-env
    volumes:
      - appdata:/data
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks: [backend-net]
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    networks: [frontend-net]
    restart: unless-stopped

networks:
  backend-net:
  frontend-net:

volumes:
  pgdata:
  appdata:
