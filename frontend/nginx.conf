server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Upload de banner de jogo
    client_max_body_size 10m;

    # Arquivos estáticos; /admin vira admin.html (igual ao express.static com extensions: ['html']).
    # O que não for arquivo é rota da API (/events, /orders, /auth, /reservations, /tickets, /health...).
    location / {
        try_files $uri $uri/index.html $uri.html @api;
    }

    location @api {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Imagens enviadas (trocado por MinIO na fase 2)
    location /uploads/ {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
    }
}
