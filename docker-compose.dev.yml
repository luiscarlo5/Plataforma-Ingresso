# Somente desenvolvimento: publica Postgres e Redis em 127.0.0.1 para rodar a API/testes fora do Docker.
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d postgres redis
services:
  postgres:
    ports:
      - "127.0.0.1:5432:5432"
  rabbitmq:
    ports:
      - "127.0.0.1:5672:5672"
  redis:
    ports:
      - "127.0.0.1:6379:6379"
