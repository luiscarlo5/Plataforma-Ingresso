# Somente desenvolvimento: publica os serviços em 127.0.0.1 para rodar a API/testes fora do Docker.
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d postgres redis rabbitmq minio dynamodb
services:
  postgres:
    ports:
      - "127.0.0.1:5432:5432"
  minio:
    ports:
      - "127.0.0.1:9000:9000"
  rabbitmq:
    ports:
      - "127.0.0.1:5672:5672"
  redis:
    ports:
      - "127.0.0.1:6379:6379"
  dynamodb:
    ports:
      - "127.0.0.1:8000:8000"
